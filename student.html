<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedStudentsHub | Student Portal</title><link rel="stylesheet" href="/css/portal.css"></head>
<body data-role="student"><div class="portal-wrap"><header class="portal-header"><div><div class="portal-logo">MedStudents<span>Hub</span></div><div class="portal-sub">Student Portal · بوابة الطالب</div></div><div class="header-links"><a href="/">الصفحة الرئيسية</a><a href="/">كتابة History جديد</a></div></header>
<div class="hero"><h1>ملف الهستريات الخاص بي</h1><p id="welcome">سجل رفع ومتابعة موافقات الدكاترة على الـHistories</p></div>
<div id="message" aria-live="polite"></div><div class="cards" id="metrics"></div>
<section class="panel"><div class="panel-head"><h2>كل الهستريات المرسلة</h2><input class="search" id="search" type="search" placeholder="بحث بالعنوان أو الدكتور..."></div><div class="scroll-table"><table><thead><tr><th>History</th><th>الدكتور</th><th>تاريخ الرفع</th><th>الحالة</th><th>التفاصيل</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="تفاصيل الهستري"><div class="dialog-card"><div class="dialog-head"><h2 id="detailTitle"></h2><button class="btn ghost" id="closeDialog">إغلاق</button></div><div id="detail"></div></div></div><script src="/js/portal.js"></script></body></html>
