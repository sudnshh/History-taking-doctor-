<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedStudentsHub | Doctor Portal</title><link rel="stylesheet" href="/css/portal.css"></head>
<body data-role="doctor"><div class="portal-wrap"><header class="portal-header"><div><div class="portal-logo">MedStudents<span>Hub</span></div><div class="portal-sub">Doctor Portal · بوابة الدكتور</div></div><div class="header-links"><a href="/">الصفحة الرئيسية</a></div></header>
<div class="hero"><h1>لوحة مراجعة الـClinical History</h1><p id="welcome">فقط طلبات الطلاب الذين اختاروك دكتوراً للمراجعة</p></div>
<div id="message" aria-live="polite"></div><div class="cards" id="metrics"></div>
<section class="panel"><div class="panel-head"><h2>الهستريات المخصصة لي</h2><input class="search" id="search" type="search" placeholder="ابحث باسم الطالب أو الحالة..."></div><div class="scroll-table"><table><thead><tr><th>History</th><th>الطالب</th><th>تاريخ الرفع</th><th>الحالة</th><th>المراجعة</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="مراجعة الهستري"><div class="dialog-card"><div class="dialog-head"><h2 id="detailTitle"></h2><button class="btn ghost" id="closeDialog">إغلاق</button></div><div id="detail"></div></div></div><script src="/js/portal.js"></script></body></html>
